[project]
name = "pooja-portfolio-backend"
version = "0.1.0"
description = "FastAPI backend for Pooja Sharma portfolio"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "PyJWT>=2.10.0",
  "pwdlib[argon2]>=0.2.1",
  "python-multipart>=0.0.17",
  "cloudinary>=1.41.0",
  "email-validator>=2.2.0",
  "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[tool.vercel]
entrypoint = "index:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
